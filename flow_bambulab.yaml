blueprint:
  name: Bambulab AWTRIX NG Printer Assistant
  description: >
    Bambulab AWTRIX NG Printer Assistant.

    Displays Bambu Lab printer status on AWTRIX NG using MQTT.

    Requires the Bambu Lab HACS integration.

    Features:
      - Nozzle temperature
      - Bed temperature
      - Remaining print time
      - Current / total layer
      - Current task name
      - Print progress bar
      - Printer stage notifications
      - Finished notification
      - Failed notification

    AWTRIX NG uses the MQTT command topics:
      - <prefix>/cmd/apps/pushed/<app>
      - <prefix>/cmd/notify
      - <prefix>/cmd/notify/dismiss

  domain: automation

  input:

    awtrix:
      name: AWTRIX NG
      description: Select the AWTRIX NG device.
      selector:
        device:
          filter:
            - integration: mqtt
              manufacturer: Blueforcer
              model: AWTRIX NG
          multiple: true

    appname:
      name: AWTRIX Application name
      description: >
        Unique AWTRIX NG pushed application name.
      default: "print_status"
      selector:
        text:

    print_status_select:
      name: Print status - Select metrics
      description: >
        Select which printer metrics should be displayed.
      selector:
        select:
          options:
            - label: Nozzle
              value: nozzle_temp
            - label: Remaining Time
              value: remaining_time
            - label: Bed Temperature
              value: bed_temp
            - label: Layers
              value: layers
            - label: Task Name
              value: task_name
          multiple: true
      default:
        - nozzle_temp
        - remaining_time
        - bed_temp
        - layers
        - task_name

    print_status_show_progress:
      name: Print status - Show progress bar
      description: Show the print progress bar.
      selector:
        boolean:
      default: true

    print_status_nozzle_temp_push_icon:
      name: Nozzle Temperature - Icon mode
      description: >
        AWTRIX NG icon scrolling behavior.
      selector:
        select:
          options:
            - label: Icon stays fixed
              value: "fixed"
            - label: Icon moves once with text
              value: "pushOnce"
            - label: Icon moves with text
              value: "push"
          mode: list
      default: "fixed"

    print_status_nozzle_temp_text_color:
      name: Nozzle Temperature - Text Color
      selector:
        color_rgb:
      default: [255, 255, 255]

    print_status_nozzle_temp_duration:
      name: Nozzle Temperature - Duration (seconds)
      description: How long this status page is displayed.
      default: "10"
      selector:
        number:
          min: 1
          max: 300
          mode: box
          unit_of_measurement: seconds

    print_status_nozzle_temp_icon:
      name: Nozzle Temperature - Icon
      description: AWTRIX icon name without file extension.
      default: "bl_heatnozzle"
      selector:
        text:

    print_status_nozzle_temp_format:
      name: Nozzle Temperature Format
      description: >
        Use %nozzle_current_temp% for current temperature and
        %nozzle_target_temp% for target temperature.
      default: "%nozzle_current_temp% / %nozzle_target_temp%"
      selector:
        text:

    print_status_task_name_push_icon:
      name: Task Name - Icon mode
      selector:
        select:
          options:
            - label: Icon stays fixed
              value: "fixed"
            - label: Icon moves once with text
              value: "pushOnce"
            - label: Icon moves with text
              value: "push"
          mode: list
      default: "fixed"

    print_status_task_name_text_color:
      name: Task Name - Text Color
      selector:
        color_rgb:
      default: [255, 255, 255]

    print_status_task_name_duration:
      name: Task Name - Duration (seconds)
      default: "10"
      selector:
        number:
          min: 1
          max: 300
          mode: box
          unit_of_measurement: seconds

    print_status_task_name_icon:
      name: Task Name - Icon
      default: "bl_green"
      selector:
        text:

    print_status_task_name_format:
      name: Task Name Format
      description: Use %task_name% for the current task name.
      default: "Task: %task_name%"
      selector:
        text:

    print_status_layer_push_icon:
      name: Layer - Icon mode
      selector:
        select:
          options:
            - label: Icon stays fixed
              value: "fixed"
            - label: Icon moves once with text
              value: "pushOnce"
            - label: Icon moves with text
              value: "push"
          mode: list
      default: "fixed"

    print_status_layer_text_color:
      name: Layer - Text Color
      selector:
        color_rgb:
      default: [255, 255, 255]

    print_status_layer_duration:
      name: Layer - Duration (seconds)
      default: "10"
      selector:
        number:
          min: 1
          max: 300
          mode: box
          unit_of_measurement: seconds

    print_status_layer_icon:
      name: Layer - Icon
      default: "bl_green"
      selector:
        text:

    print_status_layer_format:
      name: Layer Format
      description: >
        Use %current_layer% and %total_layers%.
      default: "%current_layer% / %total_layers%"
      selector:
        text:

    print_status_bed_temp_push_icon:
      name: Bed Temperature - Icon mode
      selector:
        select:
          options:
            - label: Icon stays fixed
              value: "fixed"
            - label: Icon moves once with text
              value: "pushOnce"
            - label: Icon moves with text
              value: "push"
          mode: list
      default: "fixed"

    print_status_bed_temp_text_color:
      name: Bed Temperature - Text Color
      selector:
        color_rgb:
      default: [255, 255, 255]

    print_status_bed_temp_duration:
      name: Bed Temperature - Duration (seconds)
      default: "10"
      selector:
        number:
          min: 1
          max: 300
          mode: box
          unit_of_measurement: seconds

    print_status_bed_temp_icon:
      name: Bed Temperature - Icon
      default: "bl_heatbed"
      selector:
        text:

    print_status_bed_temp_format:
      name: Bed Temperature Format
      description: >
        Use %current_bed_temp% and %target_bed_temp%.
      default: "%current_bed_temp% / %target_bed_temp%"
      selector:
        text:

    print_status_remaining_time_push_icon:
      name: Remaining Time - Icon mode
      selector:
        select:
          options:
            - label: Icon stays fixed
              value: "fixed"
            - label: Icon moves once with text
              value: "pushOnce"
            - label: Icon moves with text
              value: "push"
          mode: list
      default: "fixed"

    print_status_remaining_time_text_color:
      name: Remaining Time - Text Color
      selector:
        color_rgb:
      default: [255, 255, 255]

    print_status_remaining_time_duration:
      name: Remaining Time - Duration (seconds)
      default: "10"
      selector:
        number:
          min: 1
          max: 300
          mode: box
          unit_of_measurement: seconds

    print_status_remaining_time_icon:
      name: Remaining Time - Icon
      default: "bl_time_green"
      selector:
        text:

    print_status_remaining_time_format:
      name: Remaining Time Format
      description: Use %remaining_time%.
      default: "-%remaining_time% m"
      selector:
        text:

    stage_status_select:
      name: Stage status - Select stages
      description: >
        Select printer stages that should generate an AWTRIX notification.
      selector:
        select:
          options:
            - label: Auto bed leveling
              value: auto_bed_leveling
            - label: Heatbed Preheating
              value: heatbed_preheating
            - label: Heating Hotend
              value: heating_hotend
            - label: Cleaning Nozzle Tip
              value: cleaning_nozzle_tip
          multiple: true
      default:
        - auto_bed_leveling
        - heatbed_preheating
        - heating_hotend
        - cleaning_nozzle_tip

    stage_status_abl_text_color:
      name: Auto Bed Leveling - Text Color
      selector:
        color_rgb:
      default: [55, 158, 47]

    stage_status_abl_icon:
      name: Auto Bed Leveling - Icon
      default: "bl_bedlevel"
      selector:
        text:

    stage_status_abl_format:
      name: Auto Bed Leveling - Text
      default: "Auto bed leveling"
      selector:
        text:

    stage_status_abl_push_icon:
      name: Auto Bed Leveling - Icon mode
      selector:
        select:
          options:
            - label: Icon stays fixed
              value: "fixed"
            - label: Icon moves once with text
              value: "pushOnce"
            - label: Icon moves with text
              value: "push"
          mode: list
      default: "fixed"

    stage_status_heatbed_text_color:
      name: Heatbed Preheating - Text Color
      selector:
        color_rgb:
      default: [55, 158, 47]

    stage_status_heatbed_icon:
      name: Heatbed Preheating - Icon
      default: "bl_heatbed"
      selector:
        text:

    stage_status_heatbed_format:
      name: Heatbed Preheating - Text
      default: "Heatbed Preheating"
      selector:
        text:

    stage_status_heatbed_push_icon:
      name: Heatbed Preheating - Icon mode
      selector:
        select:
          options:
            - label: Icon stays fixed
              value: "fixed"
            - label: Icon moves once with text
              value: "pushOnce"
            - label: Icon moves with text
              value: "push"
          mode: list
      default: "fixed"

    stage_status_heatnozzle_text_color:
      name: Hotend Heating - Text Color
      selector:
        color_rgb:
      default: [55, 158, 47]

    stage_status_heatnozzle_icon:
      name: Hotend Heating - Icon
      default: "bl_heatnozzle"
      selector:
        text:

    stage_status_heatnozzle_format:
      name: Hotend Heating - Text
      default: "Nozzle Preheating"
      selector:
        text:

    stage_status_heatnozzle_push_icon:
      name: Hotend Heating - Icon mode
      selector:
        select:
          options:
            - label: Icon stays fixed
              value: "fixed"
            - label: Icon moves once with text
              value: "pushOnce"
            - label: Icon moves with text
              value: "push"
          mode: list
      default: "fixed"

    stage_status_cleannozzle_text_color:
      name: Cleaning Nozzle - Text Color
      selector:
        color_rgb:
      default: [55, 158, 47]

    stage_status_cleannozzle_icon:
      name: Cleaning Nozzle - Icon
      default: "bl_cleannozzle"
      selector:
        text:

    stage_status_cleannozzle_format:
      name: Cleaning Nozzle - Text
      default: "Cleaning Nozzle"
      selector:
        text:

    stage_status_cleannozzle_push_icon:
      name: Cleaning Nozzle - Icon mode
      selector:
        select:
          options:
            - label: Icon stays fixed
              value: "fixed"
            - label: Icon moves once with text
              value: "pushOnce"
            - label: Icon moves with text
              value: "push"
          mode: list
      default: "fixed"

    sensor_bed_temperature:
      name: Bed Temperature Sensor
      description: Select the Bambu Lab bed temperature sensor.
      selector:
        entity:
          multiple: false
          filter:
            - integration: bambu_lab
              device_class: sensor

    sensor_target_bed_temperature:
      name: Target Bed Temperature Sensor
      selector:
        entity:
          multiple: false
          filter:
            - integration: bambu_lab
              device_class: sensor

    sensor_nozzle_temperature:
      name: Nozzle Temperature Sensor
      selector:
        entity:
          multiple: false
          filter:
            - integration: bambu_lab
              device_class: sensor

    sensor_nozzle_target_temperature:
      name: Target Nozzle Temperature Sensor
      selector:
        entity:
          multiple: false
          filter:
            - integration: bambu_lab
              device_class: sensor

    sensor_print_progress:
      name: Print Progress Sensor
      selector:
        entity:
          multiple: false
          filter:
            - integration: bambu_lab

    sensor_remaining_time:
      name: Remaining Time Sensor
      selector:
        entity:
          multiple: false
          filter:
            - integration: bambu_lab

    sensor_current_layer:
      name: Current Layer Sensor
      selector:
        entity:
          multiple: false
          filter:
            - integration: bambu_lab

    sensor_total_layer_count:
      name: Total Layer Count Sensor
      selector:
        entity:
          multiple: false
          filter:
            - integration: bambu_lab

    sensor_task_name:
      name: Task Name Sensor
      selector:
        entity:
          multiple: false
          filter:
            - integration: bambu_lab

    sensor_print_status:
      name: Print Status Sensor
      selector:
        entity:
          multiple: false
          filter:
            - integration: bambu_lab

    sensor_current_stage:
      name: Current Stage Sensor
      selector:
        entity:
          multiple: false
          filter:
            - integration: bambu_lab


# ============================================================
# VARIABLES
# ============================================================

variables:

  device_ids: !input awtrix

  devices: >-
    {% macro get_device(device_id) %}
      {% set entities = device_entities(device_id) %}
      {% set mqtt_entities =
        entities
        | select('search', 'device_topic')
        | list
      %}
      {% if mqtt_entities | length > 0 %}
        {{ states(mqtt_entities[0]) }}
      {% else %}
        unknown
      {% endif %}
    {% endmacro %}

    {% set ns = namespace(devices=[]) %}

    {% for device_id in device_ids %}
      {% set device = get_device(device_id)
        | replace(' ', '')
        | replace('\n', '')
      %}

      {% if device not in ['unknown', 'unavailable', ''] %}
        {% set ns.devices = ns.devices + [device] %}
      {% endif %}
    {% endfor %}

    {{ ns.devices }}

  appname: !input appname

  val_sensor_bed_temperature: !input sensor_bed_temperature
  val_sensor_target_bed_temperature: !input sensor_target_bed_temperature

  val_sensor_nozzle_temperature: !input sensor_nozzle_temperature
  val_sensor_nozzle_target_temperature: !input sensor_nozzle_target_temperature

  val_sensor_print_progress: !input sensor_print_progress
  val_sensor_remaining_time: !input sensor_remaining_time

  val_sensor_current_layer: !input sensor_current_layer
  val_sensor_total_layer_count: !input sensor_total_layer_count

  val_sensor_task_name: !input sensor_task_name
  val_sensor_print_status: !input sensor_print_status
  val_sensor_current_stage: !input sensor_current_stage

  print_status_select: !input print_status_select
  print_status_show_progress: !input print_status_show_progress

  stage_status_select: !input stage_status_select


# ============================================================
# TRIGGERS
# ============================================================

triggers:

  - trigger: state
    entity_id: !input sensor_current_stage
    id: id_current_stage

  - trigger: state
    entity_id: !input sensor_print_progress
    id: id_print_progress

  - trigger: state
    entity_id: !input sensor_print_status
    id: id_printer_status_change


# ============================================================
# ACTIONS
# ============================================================

actions:

  - repeat:
      for_each: "{{ devices }}"

      sequence:

        - choose:

            # ==================================================
            # CURRENT PRINTER STAGE
            # ==================================================

            - conditions:

                - condition: trigger
                  id:
                    - id_current_stage

                - condition: template
                  value_template: >
                    {{ states(val_sensor_current_stage)
                       in stage_status_select }}

              sequence:

                - variables:

                    printer_stage: >
                      {{ states(val_sensor_current_stage) }}

                    stage_payload: >-
                      {% set stage = states(val_sensor_current_stage) %}

                      {% if stage == 'auto_bed_leveling' %}
                        {
                          "hold": true,
                          "stack": false,
                          "iconMode": "{{ stage_status_abl_push_icon }}",
                          "icon": "{{ stage_status_abl_icon }}",
                          "textColor": {{ stage_status_abl_text_color | tojson }},
                          "text": {{ stage_status_abl_format | tojson }}
                        }

                      {% elif stage == 'heatbed_preheating' %}
                        {
                          "hold": true,
                          "stack": false,
                          "iconMode": "{{ stage_status_heatbed_push_icon }}",
                          "icon": "{{ stage_status_heatbed_icon }}",
                          "textColor": {{ stage_status_heatbed_text_color | tojson }},
                          "text": {{ stage_status_heatbed_format | tojson }}
                        }

                      {% elif stage == 'heating_hotend' %}
                        {
                          "hold": true,
                          "stack": false,
                          "iconMode": "{{ stage_status_heatnozzle_push_icon }}",
                          "icon": "{{ stage_status_heatnozzle_icon }}",
                          "textColor": {{ stage_status_heatnozzle_text_color | tojson }},
                          "text": {{ stage_status_heatnozzle_format | tojson }}
                        }

                      {% elif stage == 'cleaning_nozzle_tip' %}
                        {
                          "hold": true,
                          "stack": false,
                          "iconMode": "{{ stage_status_cleannozzle_push_icon }}",
                          "icon": "{{ stage_status_cleannozzle_icon }}",
                          "textColor": {{ stage_status_cleannozzle_text_color | tojson }},
                          "text": {{ stage_status_cleannozzle_format | tojson }}
                        }

                      {% else %}
                        {}
                      {% endif %}

                - action: mqtt.publish
                  data:
                    topic: "{{ repeat.item }}/cmd/notify/dismiss"
                    payload: ""

                - action: mqtt.publish
                  data:
                    topic: "{{ repeat.item }}/cmd/notify"
                    payload: "{{ stage_payload }}"


            # ==================================================
            # PRINT PROGRESS
            # ==================================================

            - conditions:

                - condition: trigger
                  id:
                    - id_print_progress

                - condition: numeric_state
                  entity_id: !input sensor_current_layer
                  above: 0

                - condition: numeric_state
                  entity_id: !input sensor_print_progress
                  above: 0
                  below: 100

              sequence:

                - variables:

                    progress_payload: >-
                      {% set progress =
                        states(val_sensor_print_progress)
                        | float(0)
                      %}

                      {% set parts = namespace(values=[]) %}

                      {% if 'task_name' in print_status_select %}
                        {% set task =
                          states(val_sensor_task_name)
                        %}
                        {% set task_text =
                          (
                            print_status_task_name_format
                            | replace('%task_name%', task)
                          )
                        %}
                        {% set parts.values =
                          parts.values + [task_text]
                        %}
                      {% endif %}

                      {% if 'layers' in print_status_select %}
                        {% set layer_text =
                          (
                            print_status_layer_format
                            | replace(
                              '%current_layer%',
                              states(val_sensor_current_layer)
                            )
                            | replace(
                              '%total_layers%',
                              states(val_sensor_total_layer_count)
                            )
                          )
                        %}
                        {% set parts.values =
                          parts.values + [layer_text]
                        %}
                      {% endif %}

                      {% if 'remaining_time' in print_status_select %}
                        {% set remaining_text =
                          (
                            print_status_remaining_time_format
                            | replace(
                              '%remaining_time%',
                              states(val_sensor_remaining_time)
                            )
                          )
                        %}
                        {% set parts.values =
                          parts.values + [remaining_text]
                        %}
                      {% endif %}

                      {% if 'nozzle_temp' in print_status_select %}
                        {% set nozzle_text =
                          (
                            print_status_nozzle_temp_format
                            | replace(
                              '%nozzle_current_temp%',
                              states(val_sensor_nozzle_temperature)
                            )
                            | replace(
                              '%nozzle_target_temp%',
                              states(val_sensor_nozzle_target_temperature)
                            )
                          )
                        %}
                        {% set parts.values =
                          parts.values + [nozzle_text]
                        %}
                      {% endif %}

                      {% if 'bed_temp' in print_status_select %}
                        {% set bed_text =
                          (
                            print_status_bed_temp_format
                            | replace(
                              '%current_bed_temp%',
                              states(val_sensor_bed_temperature)
                            )
                            | replace(
                              '%target_bed_temp%',
                              states(val_sensor_target_bed_temperature)
                            )
                          )
                        %}
                        {% set parts.values =
                          parts.values + [bed_text]
                        %}
                      {% endif %}

                      {% set text =
                        parts.values | join(' | ')
                      %}

                      {
                        "text": {{ text | tojson }},
                        "durationMs": 10000,
                        "progress": {{ progress | round(0) | int }},
                        "progressColor": "#00FF00",
                        "progressTrackColor": "#202020"
                      }

                - action: mqtt.publish
                  data:
                    topic: "{{ repeat.item }}/cmd/notify/dismiss"
                    payload: ""

                - action: mqtt.publish
                  data:
                    topic: "{{ repeat.item }}/cmd/apps/pushed/{{ appname }}"
                    payload: "{{ progress_payload }}"


            # ==================================================
            # PRINT FINISHED
            # ==================================================

            - conditions:

                - condition: template
                  value_template: >
                    {{
                      trigger.id == 'id_printer_status_change'
                      and trigger.from_state is not none
                      and trigger.to_state is not none
                      and trigger.from_state.state == 'running'
                      and trigger.to_state.state == 'finish'
                    }}

              sequence:

                - action: mqtt.publish
                  data:
                    topic: "{{ repeat.item }}/cmd/apps/pushed/{{ appname }}"
                    payload: ""

                - action: mqtt.publish
                  data:
                    topic: "{{ repeat.item }}/cmd/notify/dismiss"
                    payload: ""

                - action: mqtt.publish
                  data:
                    topic: "{{ repeat.item }}/cmd/notify"
                    payload: >-
                      {
                        "icon": "bl_green",
                        "hold": false,
                        "durationMs": 240000,
                        "stack": false,
                        "text": "Done",
                        "textColor": "#008000"
                      }


            # ==================================================
            # PRINT FAILED
            # ==================================================

            - conditions:

                - condition: template
                  value_template: >
                    {{
                      trigger.id == 'id_printer_status_change'
                      and trigger.from_state is not none
                      and trigger.to_state is not none
                      and trigger.from_state.state == 'running'
                      and trigger.to_state.state == 'failed'
                    }}

              sequence:

                - action: mqtt.publish
                  data:
                    topic: "{{ repeat.item }}/cmd/apps/pushed/{{ appname }}"
                    payload: ""

                - action: mqtt.publish
                  data:
                    topic: "{{ repeat.item }}/cmd/notify/dismiss"
                    payload: ""

                - action: mqtt.publish
                  data:
                    topic: "{{ repeat.item }}/cmd/notify"
                    payload: >-
                      {
                        "icon": "bl_red",
                        "hold": false,
                        "durationMs": 240000,
                        "stack": false,
                        "text": "Failed",
                        "textColor": "#FF0000"
                      }


mode: restart
