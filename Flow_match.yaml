
alias: "AWTRIX NG - Fußball Live"
description: >-
  Zeigt den Live-Spielstand eines TeamTracker-Sensors auf mehreren
  AWTRIX NG Displays an. Unterstützt Teamfarben, Spieluhr,
  letzte Spielaktion, Halbzeit und automatisches Ein-/Ausblenden.

triggers:
  - trigger: state
    entity_id: sensor.teamtracker_dein_verein
    to: "IN"
    id: game_start

  - trigger: state
    entity_id: sensor.teamtracker_dein_verein
    to:
      - "PRE"
      - "POST"
      - "NOT_FOUND"
    id: no_game

  - trigger: state
    entity_id: sensor.teamtracker_dein_verein
    attribute: team_score
    id: home_score

  - trigger: state
    entity_id: sensor.teamtracker_dein_verein
    attribute: opponent_score
    id: away_score

  - trigger: state
    entity_id: sensor.teamtracker_dein_verein
    attribute: clock
    id: clock_change

  - trigger: state
    entity_id: sensor.teamtracker_dein_verein
    attribute: last_play
    id: last_play

  - trigger: state
    entity_id: sensor.teamtracker_dein_verein
    attribute: quarter
    to: "2"
    id: halftime

  - trigger: homeassistant
    event: start
    id: ha_start

conditions: []

actions:
  - variables:
      my_sensor: sensor.teamtracker_dein_verein

      # MQTT-Präfixe deiner AWTRIX-NG-Geräte
      awtrix_devices:
        - awtrixNG
        - awtrixNG_2

      appname: fussball
      message_duration: 15

      game_state: "{{ states(my_sensor) }}"

      homegame: >-
        {{ state_attr(my_sensor, 'team_homeaway') == 'home' }}

      team_colors: >-
        {{ state_attr(my_sensor, 'team_colors') or ['#FFFFFF', '#AAAAAA'] }}

      opponent_colors: >-
        {{ state_attr(my_sensor, 'opponent_colors') or ['#FFFFFF', '#AAAAAA'] }}

      team_name: >-
        {{ state_attr(my_sensor, 'team_abbr') or 'TEAM' }}

      opponent_name: >-
        {{ state_attr(my_sensor, 'opponent_abbr') or 'GAST' }}

      home_team_score: >-
        {% if homegame %}
          {{ state_attr(my_sensor, 'team_score') | default(0, true) }}
        {% else %}
          {{ state_attr(my_sensor, 'opponent_score') | default(0, true) }}
        {% endif %}

      away_team_score: >-
        {% if homegame %}
          {{ state_attr(my_sensor, 'opponent_score') | default(0, true) }}
        {% else %}
          {{ state_attr(my_sensor, 'team_score') | default(0, true) }}
        {% endif %}

      home_color_1: >-
        {{ (team_colors if homegame else opponent_colors)[0] }}

      home_color_2: >-
        {{ (team_colors if homegame else opponent_colors)[1]
           if (team_colors if homegame else opponent_colors) | length > 1
           else '#FFFFFF' }}

      away_color_1: >-
        {{ (opponent_colors if homegame else team_colors)[0] }}

      away_color_2: >-
        {{ (opponent_colors if homegame else team_colors)[1]
           if (opponent_colors if homegame else team_colors) | length > 1
           else '#FFFFFF' }}

      game_clock: >-
        {{ state_attr(my_sensor, 'clock') or '' }}

      last_play_text: >-
        {% set lp = state_attr(my_sensor, 'last_play') %}
        {% if lp is string %}
          {{ lp | trim }}
        {% else %}
          {{ '' }}
        {% endif %}

      game_quarter: >-
        {{ state_attr(my_sensor, 'quarter') or '' }}

  - choose:
      # Spiel nicht aktiv: App auf allen Geräten entfernen
      - conditions:
          - condition: template
            value_template: >-
              {{ game_state in ['PRE', 'POST', 'NOT_FOUND',
                                'unknown', 'unavailable'] }}
        sequence:
          - repeat:
              for_each: "{{ awtrix_devices }}"
              sequence:
                - action: mqtt.publish
                  data:
                    topic: "{{ repeat.item }}/cmd/apps/pushed/{{ appname }}"
                    payload: ""
                    qos: 0
                    retain: false

    default:
      - variables:
          display_text: >-
            {{ team_name }} {{ home_team_score }}-{{ away_team_score }}
            {{ opponent_name }}  {{ game_clock }}
            {% if last_play_text | length > 0 %}
              | {{ last_play_text }}
            {% endif %}

          app_payload:
            text: "{{ display_text | trim }}"
            duration: "{{ message_duration }}"
            background: "#006C28"
            textColor: "#FFFFFF"
            draw:
              - df:
                  - 0
                  - 1
                  - 8
                  - 2
                  - "{{ home_color_1 }}"
              - df:
                  - 1
                  - 3
                  - 6
                  - 5
                  - "{{ home_color_1 }}"
              - dl:
                  - 3
                  - 0
                  - 4
                  - 0
                  - "{{ home_color_1 }}"
              - dl:
                  - 2
                  - 2
                  - 2
                  - 7
                  - "{{ home_color_2 }}"
              - dl:
                  - 5
                  - 2
                  - 5
                  - 7
                  - "{{ home_color_2 }}"
              - df:
                  - 24
                  - 1
                  - 8
                  - 2
                  - "{{ away_color_1 }}"
              - df:
                  - 25
                  - 3
                  - 6
                  - 5
                  - "{{ away_color_1 }}"
              - dl:
                  - 27
                  - 0
                  - 28
                  - 0
                  - "{{ away_color_1 }}"
              - dl:
                  - 26
                  - 2
                  - 26
                  - 7
                  - "{{ away_color_2 }}"
              - dl:
                  - 29
                  - 2
                  - 29
                  - 7
                  - "{{ away_color_2 }}"

      - repeat:
          for_each: "{{ awtrix_devices }}"
          sequence:
            - action: mqtt.publish
              data:
                topic: "{{ repeat.item }}/cmd/apps/pushed/{{ appname }}"
                payload: "{{ app_payload | to_json }}"
                qos: 0
                retain: false

            - action: mqtt.publish
              data:
                topic: "{{ repeat.item }}/cmd/apps/switch"
                payload: "{{ appname }}"
                qos: 0
                retain: false

mode: restart
max_exceeded: silent
