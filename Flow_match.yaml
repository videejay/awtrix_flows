blueprint:
  name: "AWTRIX NG - Fußball Live"
  description: >-
    Zeigt den Live-Spielstand eines TeamTracker-Sensors auf
    mehreren AWTRIX-Geräten an.

    Funktionen:
    - Spielstand und Spieluhr
    - Heim- und Auswärtsteam automatisch erkennen
    - Teamfarben als Pixelgrafik
    - Letzte Spielaktion
    - Halbzeit- und Spielereignisse
    - Automatisches Ein- und Ausblenden
    - Mehrere AWTRIX-Geräte

  domain: automation
  author: matbott / ChatGPT

  input:
    awtrix:
      name: AWTRIX NG Geräte
      description: Wähle deine AWTRIX-Geräte aus.
      selector:
        device:
          integration: mqtt
          manufacturer: Blueforcer
          model: AWTRIX 3
          multiple: true

    my_sensor:
      name: TeamTracker Sensor
      description: Wähle deinen Fußball-TeamTracker-Sensor.
      selector:
        entity:
          filter:
            - integration: teamtracker
          multiple: false

    appname:
      name: App-Name
      description: Eindeutiger Name der AWTRIX-App.
      default: app_futbol
      selector:
        text:

    message_duration:
      name: Anzeigedauer
      description: Anzeigedauer der App in Sekunden.
      default: 15
      selector:
        number:
          min: 1
          max: 300
          step: 1
          unit_of_measurement: sec
          mode: slider

variables:
  device_ids: !input awtrix
  my_sensor: !input my_sensor
  appname: !input appname
  message_duration: !input message_duration

  devices: >-
    {% set ns = namespace(items=[]) %}
    {% for device_id in device_ids %}
      {% set entities = device_entities(device_id)
        | select('search', 'device_topic')
        | list %}
      {% if entities | count > 0 %}
        {% set topic = states(entities[0]) | trim %}
        {% if topic not in ['unknown', 'unavailable', ''] %}
          {% set ns.items = ns.items + [topic] %}
        {% endif %}
      {% endif %}
    {% endfor %}
    {{ ns.items }}

  homegame: >-
    {{ state_attr(my_sensor, 'team_homeaway') == 'home' }}

  team_colors: >-
    {{ state_attr(my_sensor, 'team_colors') or ['#FFFFFF', '#AAAAAA'] }}

  opponent_colors: >-
    {{ state_attr(my_sensor, 'opponent_colors') or ['#FFFFFF', '#AAAAAA'] }}

  home_colors: >-
    {{ team_colors if homegame else opponent_colors }}

  away_colors: >-
    {{ opponent_colors if homegame else team_colors }}

  home_color_1: >-
    {{ home_colors[0] }}

  home_color_2: >-
    {{ home_colors[1] if home_colors | length > 1 else '#FFFFFF' }}

  away_color_1: >-
    {{ away_colors[0] }}

  away_color_2: >-
    {{ away_colors[1] if away_colors | length > 1 else '#FFFFFF' }}

  home_team: >-
    {{ state_attr(my_sensor, 'team_abbr') if homegame
       else state_attr(my_sensor, 'opponent_abbr') }}

  away_team: >-
    {{ state_attr(my_sensor, 'opponent_abbr') if homegame
       else state_attr(my_sensor, 'team_abbr') }}

  home_score: >-
    {{ state_attr(my_sensor, 'team_score') if homegame
       else state_attr(my_sensor, 'opponent_score') }}

  away_score: >-
    {{ state_attr(my_sensor, 'opponent_score') if homegame
       else state_attr(my_sensor, 'team_score') }}

  game_clock: >-
    {{ state_attr(my_sensor, 'clock') or '' }}

  last_play: >-
    {{ state_attr(my_sensor, 'last_play') or '' }}

triggers:
  - trigger: state
    entity_id: !input my_sensor
    to: "IN"
    id: game_start

  - trigger: state
    entity_id: !input my_sensor
    to:
      - "PRE"
      - "POST"
      - "NOT_FOUND"
    id: no_game

  - trigger: state
    entity_id: !input my_sensor
    attribute: team_score
    id: score_home

  - trigger: state
    entity_id: !input my_sensor
    attribute: opponent_score
    id: score_away

  - trigger: state
    entity_id: !input my_sensor
    attribute: clock
    id: clock

  - trigger: state
    entity_id: !input my_sensor
    attribute: last_play
    id: last_play

  - trigger: state
    entity_id: !input my_sensor
    attribute: quarter
    to: "2"
    id: halftime

  - trigger: homeassistant
    event: start
    id: ha_start

conditions: []

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: no_game
        sequence:
          - repeat:
              for_each: "{{ devices }}"
              sequence:
                - action: mqtt.publish
                  data:
                    topic: "{{ repeat.item }}/custom/{{ appname }}"
                    payload: "{}"
                    qos: 0
                    retain: false

    default:
      - condition: state
        entity_id: !input my_sensor
        state: "IN"

      - repeat:
          for_each: "{{ devices }}"
          sequence:
            - action: mqtt.publish
              data:
                topic: "{{ repeat.item }}/custom/{{ appname }}"
                qos: 0
                retain: false
                payload: >-
                  {{
                    {
                      "text":
                        "     " ~
                        (home_team | default('TEAM', true)) ~
                        " " ~
                        (home_score | default(0, true) | string) ~
                        "-" ~
                        (away_score | default(0, true) | string) ~
                        " " ~
                        (away_team | default('GAST', true)) ~
                        " - " ~
                        game_clock ~
                        " | " ~
                        last_play,

                      "duration": message_duration | int,
                      "background": "#006c28",

                      "draw": [
                        {"df": [0,1,8,2,home_color_1]},
                        {"df": [1,3,6,5,home_color_1]},
                        {"dl": [3,0,4,0,home_color_1]},
                        {"dl": [2,2,2,7,home_color_2]},
                        {"dl": [5,2,5,7,home_color_2]},
                        {"df": [24,1,8,2,away_color_1]},
                        {"df": [25,3,6,5,away_color_1]},
                        {"dl": [27,0,28,0,away_color_1]},
                        {"dl": [26,2,26,7,away_color_2]},
                        {"dl": [29,2,29,7,away_color_2]}
                      ]
                    } | to_json
                  }}

            - action: mqtt.publish
              data:
                topic: "{{ repeat.item }}/switch"
                payload: >-
                  {{ {"name": appname} | to_json }}
                qos: 0
                retain: false

mode: restart
max_exceeded: silent
